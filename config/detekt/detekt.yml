# buildUponDefaultConfig is on, so only the deviations from detekt's defaults belong here.

complexity:
  LongMethod:
    # A composable's length tracks the size of the UI tree it describes, not its complexity
    ignoreAnnotated: ['Composable']

naming:
  FunctionNaming:
    # The Compose API guidelines name composables after the UI element they emit
    ignoreAnnotated: ['Composable']

style:
  ReturnCount:
    excludeGuardClauses: true
